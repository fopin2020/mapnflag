<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>지도 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Spectral:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --sea:#12243d; --sea-line:rgba(201,162,74,.05);
    --land-off:#8a8368; --land-off-line:#6d6752;
    --land-on:#efe6cf; --land-on-line:#7d7a6a; --land-hover:#fff6df; --land-done:#a9c6ad;
    --ink:#0d1b2e; --panel:rgba(18,33,55,.94); --card:#16283f; --line:#2a3f5e;
    --gold:#c9a24a; --gold-bright:#e8c877; --ok:#5fa87a; --bad:#c1614a; --dim:#8fa3c2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{ background:var(--ink); color:var(--land-on); font-family:'Gowun Dodum',sans-serif;
        -webkit-tap-highlight-color:transparent; }
  .is-hidden{ display:none !important; }
  .screen{ position:fixed; inset:0; display:none; }
  .screen.on{ display:block; }

  /* ================= 홈 ================= */
  #lobby, #duelHome, #trophyHome{ overflow:hidden; }
  .home{ height:100%; display:flex; flex-direction:column; padding:14px 18px 18px; }
  .home-top{ display:flex; align-items:center; justify-content:space-between; gap:12px;
             padding-bottom:12px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .home-top h1{ font-family:'Spectral',serif; font-size:26px; margin:0; letter-spacing:.02em; }
  .purse{ display:flex; align-items:baseline; gap:8px; }
  .purse .n{ font-family:'Spectral',serif; font-size:24px; font-weight:700; color:var(--gold-bright); }
  .purse .l{ font-size:11px; letter-spacing:.12em; color:var(--dim); }
  .ghost.tiny{ padding:5px 11px; font-size:12.5px; margin-left:10px; }

  .home-body{ flex:1 1 auto; min-height:0; display:grid; gap:14px; padding-top:14px;
              grid-template-columns:230px 1fr 230px 210px; }
  .duel-body{ grid-template-columns:250px 250px 1fr; }
  .col{ min-height:0; display:flex; flex-direction:column; gap:9px; }
  .col-list{ overflow-y:auto; }
  .col-globe{ align-items:center; justify-content:center; position:relative; }
  #globe{ width:100%; height:100%; display:block; }
  .globe-cap{ position:absolute; bottom:6px; left:0; right:0; text-align:center;
              font-size:13px; color:var(--dim); pointer-events:none; }

  .mbtn{ background:var(--card); border:1px solid var(--line); color:var(--land-on);
         border-radius:14px; padding:14px 16px; font-family:inherit; text-align:left;
         cursor:pointer; transition:border-color .12s ease, background .12s ease; }
  .mbtn:hover{ border-color:var(--gold); }
  .mbtn.on{ border-color:var(--gold); background:rgba(201,162,74,.16); }
  .mbtn.locked{ opacity:.45; cursor:default; }
  .mbtn.locked:hover{ border-color:var(--line); }
  .mbtn .t{ font-size:19px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mbtn .s{ font-size:12.5px; color:var(--dim); margin-top:4px; }
  .mbtn .p{ font-family:'Spectral',serif; font-size:14px; color:var(--gold-bright); }
  .lbtn{ background:rgba(22,40,63,.7); border:1px solid var(--line); color:var(--land-on);
         border-radius:11px; padding:11px 13px; font-family:inherit; text-align:left; cursor:pointer; }
  .lbtn:hover{ border-color:var(--gold); }
  .lbtn.on{ border-color:var(--gold); background:rgba(201,162,74,.14); }
  .lbtn.locked{ opacity:.45; cursor:default; }
  .lbtn.locked:hover{ border-color:var(--line); }
  .lbtn .t{ font-size:15.5px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .lbtn .s{ font-size:12px; color:var(--dim); margin-top:3px; }
  .col-head{ font-size:12px; letter-spacing:.16em; color:var(--gold); padding:2px 2px 2px; flex:0 0 auto; }
  .col-empty{ font-size:13px; color:var(--dim); padding:8px 2px; }
  .col-foot{ margin-top:auto; padding-top:10px; flex:0 0 auto; position:sticky; bottom:0;
             background:linear-gradient(to top, var(--ink) 60%, transparent); }
  .btn-gold.wide{ width:100%; padding:13px 10px; font-size:15.5px; border-radius:11px; }

  .col-info{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; overflow-y:auto; }
  .col-info h3{ margin:0 0 8px; font-size:19px; font-weight:400; color:var(--gold-bright); }
  .col-info p{ margin:0 0 10px; font-size:13.5px; color:var(--dim); line-height:1.75; }
  .col-info .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0;
                  border-top:1px solid var(--line); }
  .col-info .row b{ color:var(--land-on); font-weight:400; }

  .trophy-wrap{ flex:1 1 auto; min-height:0; overflow-y:auto; padding-top:14px;
                display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
                gap:11px; align-content:start; }
  .trophy{ background:var(--card); border:1px solid var(--line); border-radius:13px;
           padding:14px 12px; text-align:center; }
  .trophy.got{ border-color:var(--gold); background:rgba(201,162,74,.1); }
  .trophy .ic{ font-size:27px; line-height:1.2; filter:grayscale(1) opacity(.35); }
  .trophy.got .ic{ filter:none; }
  .trophy .nm{ font-size:14px; margin-top:6px; }
  .trophy .ds{ font-size:11.5px; color:var(--dim); margin-top:3px; line-height:1.5; }

  @media (max-width:900px){
    .home-body{ grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr; }
    .col-globe{ display:none; }
    .duel-body{ grid-template-columns:1fr 1fr; }
  }

  /* ================= 학습 목록 ================= */
  #learn{ overflow-y:auto; }
  .learn-inner{ max-width:940px; margin:0 auto; padding:20px 20px 40px; }
  .bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .bar-l{ display:flex; align-items:center; gap:10px; }
  .ghost{ background:rgba(13,27,46,.7); border:1px solid var(--line); color:var(--dim);
          border-radius:9px; padding:8px 14px; font-family:inherit; font-size:14px; cursor:pointer; }
  .ghost:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .steps{ display:flex; gap:6px; }
  .step-chip{ background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:999px;
              padding:6px 13px; font-family:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  .step-chip.on{ border-color:var(--gold); color:var(--gold-bright); background:rgba(201,162,74,.14); }

  .grid-learn{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:11px; }
  .lcard{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px; }
  .lcard .fl{ width:100%; border-radius:6px; overflow:hidden; line-height:0; background:#0f1e33; margin-bottom:9px; }
  .lcard .fl svg, .lcard .fl img{ display:block; width:100%; height:auto; aspect-ratio:4/3; }
  .lcard .nm{ font-size:16px; }
  .lcard .cp{ font-size:13px; color:var(--dim); margin-top:3px; }
  .cap-row{ display:flex; align-items:center; justify-content:space-between; gap:10px;
            background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .cap-row .nm{ font-size:16px; }
  .cap-row .cp{ font-size:16px; color:var(--gold-bright); font-family:'Spectral',serif; }
  .grid-cap{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .learn-foot{ margin-top:22px; display:flex; justify-content:flex-end; gap:10px; }
  .btn-gold{ background:var(--gold); border:none; color:var(--ink); font-family:inherit;
    font-weight:700; font-size:15px; padding:11px 26px; border-radius:9px; cursor:pointer; }

  /* ================= 지도 화면 ================= */
  .map-wrap{ position:absolute; inset:0; background:var(--sea); }
  #map{ display:block; width:100%; height:100%; touch-action:none; }
  .grid-line{ stroke:var(--sea-line); stroke-width:1; vector-effect:non-scaling-stroke; }
  .land-off{ fill:var(--land-off); stroke:var(--land-off-line); stroke-width:.5; pointer-events:none; vector-effect:non-scaling-stroke; }
  .country{ fill:var(--land-on); stroke:var(--land-on-line); stroke-width:.9; transition:fill .12s ease; vector-effect:non-scaling-stroke; }
  .country.hover{ fill:var(--land-hover); }
  .country.done{ fill:var(--land-done); }
  .country.active{ fill:var(--gold-bright); }
  .mini{ fill:none; stroke:var(--dim); stroke-width:1.8; pointer-events:none; vector-effect:non-scaling-stroke; }
  .mini.done{ stroke:var(--land-done); } .mini.active{ stroke:var(--gold-bright); }
  .dot-city{ fill:var(--land-on); stroke:var(--land-on-line); stroke-width:.7; pointer-events:none; vector-effect:non-scaling-stroke; }
  .dot-city.done{ fill:var(--land-done); } .dot-city.active{ fill:var(--gold-bright); }
  .hit{ fill:transparent; cursor:pointer; }
  .hit.off{ pointer-events:none; cursor:default; }
  .cap-dot{ fill:#d24b32; stroke:#efe6cf; stroke-width:1.4; pointer-events:none; vector-effect:non-scaling-stroke; }
  .flag-img{ pointer-events:none; }
  .flag-pin{ pointer-events:none; }
  .label{ font-size:12px; fill:#33405a; text-anchor:middle; pointer-events:none;
          paint-order:stroke; stroke:rgba(239,230,207,.85); stroke-width:2.5px; }

  .hud{ position:absolute; top:0; left:0; right:0; padding:10px 14px; display:flex;
        align-items:flex-start; justify-content:space-between; gap:10px; pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  .stats{ display:flex; gap:16px; background:rgba(13,27,46,.8); border:1px solid var(--line);
          border-radius:10px; padding:6px 12px; }
  .stat{ text-align:right; line-height:1.15; }
  .stat .num{ font-family:'Spectral',serif; font-size:18px; font-weight:700; color:var(--gold-bright); }
  .stat .lbl{ font-size:10px; letter-spacing:.1em; color:var(--dim); }
  .modetag{ background:rgba(13,27,46,.8); border:1px solid var(--line); border-radius:10px;
            padding:7px 13px; font-size:14px; color:var(--dim); }
  .modetag b{ color:var(--gold-bright); font-weight:400; }

  .timer{ position:absolute; top:8px; left:50%; transform:translateX(-50%);
    font-family:'Spectral',serif; font-size:27px; font-weight:700; color:var(--gold-bright);
    background:rgba(13,27,46,.85); border:1px solid var(--gold); border-radius:999px;
    padding:3px 18px; line-height:1.2; min-width:78px; text-align:center; }
  .timer.low{ color:#ef8f72; border-color:#ef8f72; }

  .zoomctl{ position:absolute; right:14px; bottom:calc(14px + var(--dock,0px)); display:flex;
            flex-direction:column; gap:6px; transition:bottom .18s ease; }
  .zoomctl button{ width:38px; height:38px; border-radius:10px; cursor:pointer;
    background:rgba(13,27,46,.82); border:1px solid var(--line); color:var(--land-on);
    font-family:'Spectral',serif; font-size:18px; line-height:1; }

  .hint-pill{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(13,27,46,.82); border:1px solid var(--line); color:var(--dim);
    border-radius:999px; padding:8px 18px; font-size:14px; white-space:nowrap; transition:opacity .2s ease; }

  .gold-pop{ position:absolute; left:50%; top:38%; transform:translateX(-50%); font-family:'Spectral',serif;
    font-size:26px; font-weight:700; color:var(--gold-bright); text-shadow:0 2px 8px rgba(0,0,0,.8);
    pointer-events:none; animation:floatUp .7s ease forwards; }
  @keyframes floatUp{ from{opacity:1;transform:translate(-50%,0);} to{opacity:0;transform:translate(-50%,-40px);} }

  .overlay{ position:absolute; inset:0; z-index:20; background:rgba(13,27,46,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    text-align:center; padding:24px; }
  .overlay h2{ font-family:'Spectral',serif; font-size:30px; margin:0; color:var(--gold-bright); }
  .overlay p{ margin:0; color:var(--dim); font-size:15px; line-height:1.8; }
  .ov-btns{ display:flex; gap:10px; margin-top:8px; }
  .ov-count{ font-size:12.5px; color:var(--dim); margin-top:2px; }

  .dock{ position:absolute; left:0; right:0; bottom:0; z-index:15; background:var(--panel);
    border-top:1px solid var(--line); padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .18s ease; }
  .dock.open{ transform:translateY(0); }
  .dock-inner{ max-width:900px; margin:0 auto; }
  .q-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .q-ask{ font-size:17px; color:var(--gold-bright); }
  .q-sub{ font-size:16px; color:var(--land-on); }
  .close-x{ background:none; border:1px solid var(--line); color:var(--dim); width:30px; height:30px;
            border-radius:50%; font-size:14px; cursor:pointer; line-height:1; flex-shrink:0; }
  .opts{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; align-items:start; }
  .opt{ position:relative; overflow:hidden; border:2px solid var(--line); background:#1d3253;
        color:var(--land-on); border-radius:9px; padding:13px 4px; font-family:inherit;
        font-size:19px; line-height:1.25; cursor:pointer; text-align:center;
        transition:border-color .12s ease, transform .08s ease; }
  .opt.flag{ padding:0; line-height:0; background:#0f1e33; }
  .opt.flag .flagbox{ display:block; width:100%; }
  .opt.flag .flagbox svg, .opt.flag .flagbox img{ display:block; width:100%; height:auto; aspect-ratio:4/3; }
  .opt:active{ transform:scale(.97); }
  .opt.picked{ border-color:var(--gold-bright); background:#27406a; }
  .opt.marked-ok{ border-color:var(--ok); } .opt.marked-bad{ border-color:var(--bad); }
  .mark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Spectral',serif; font-weight:700; font-size:46px; line-height:1;
    background:rgba(13,27,46,.4); pointer-events:none; }
  .mark.ok{ color:var(--ok); } .mark.bad{ color:var(--bad); }
  .q-foot{ display:flex; align-items:center; gap:14px; margin-top:11px; }
  .submit{ background:var(--gold); border:none; color:var(--ink); font-family:inherit; font-weight:700;
           font-size:16px; padding:11px 32px; border-radius:9px; cursor:pointer; }
  .submit:disabled{ background:#22374f; color:#63758f; cursor:default; }
  .msg{ font-size:16px; } .msg.ok{ color:var(--ok); } .msg.bad{ color:var(--bad); }

  /* 학습 모드 정보 카드 */
  .info{ display:flex; align-items:center; gap:16px; }
  .info .fl{ width:112px; flex:0 0 112px; line-height:0; border-radius:7px; overflow:hidden; background:#0f1e33; }
  .info .fl svg, .info .fl img{ display:block; width:100%; height:auto; aspect-ratio:4/3; }
  .info .txt{ flex:1; }
  .info .nm{ font-size:24px; color:var(--land-on); }
  .info .cp{ font-size:16px; color:var(--dim); margin-top:4px; }
  .info .cp b{ color:var(--gold-bright); font-weight:400; }
  .info .nm.one{ font-size:34px; line-height:1.35; letter-spacing:.01em; }
  .info .nm.one .sep{ color:var(--dim); margin:0 6px; }
  .info .nm.one b{ color:var(--gold-bright); font-weight:400; }

  @media (max-width:760px){
    .cards, .tiers{ grid-template-columns:1fr; }
    .lobby-inner{ padding:18px 14px 32px; }
    .brand h1{ font-size:27px; }
    .opt{ font-size:15px; padding:10px 2px; }
    .info .nm.one{ font-size:24px; }
    .timer{ font-size:22px; }
  }
</style>
</head>
<body>

<!-- ===================== 홈 ===================== -->
<div class="screen on" id="lobby">
  <div class="home">
    <div class="home-top">
      <h1>지도 대탐험</h1>
      <div class="purse"><span class="n" id="lobbyGold">0</span><span class="l">골드</span>
        <button class="ghost tiny" id="resetBtn">진도 초기화</button></div>
    </div>
    <div class="home-body">
      <nav class="col col-menu" id="menuCol"></nav>
      <div class="col col-globe">
        <svg id="globe"></svg>
        <div class="globe-cap" id="globeCap">지도 대탐험</div>
      </div>
      <div class="col col-list" id="stepCol"></div>
      <div class="col col-list" id="regionCol"></div>
    </div>
  </div>
</div>

<!-- ===================== 겨루기 홈 ===================== -->
<div class="screen" id="duelHome">
  <div class="home">
    <div class="home-top">
      <h1>겨루기</h1>
      <div class="purse"><span class="n" id="duelGold">0</span><span class="l">골드</span>
        <button class="ghost tiny" onclick="goHome()">← 홈</button></div>
    </div>
    <div class="home-body duel-body">
      <div class="col col-list" id="duelModeCol"></div>
      <div class="col col-list" id="duelLeagueCol"></div>
      <div class="col col-info" id="duelInfo"></div>
    </div>
  </div>
</div>

<!-- ===================== 기록실 ===================== -->
<div class="screen" id="trophyHome">
  <div class="home">
    <div class="home-top">
      <h1>기록실</h1>
      <div class="purse"><span class="n" id="trophyCount">0</span><span class="l">트로피</span>
        <button class="ghost tiny" onclick="goHome()">← 홈</button></div>
    </div>
    <div class="trophy-wrap" id="trophyWrap"></div>
  </div>
</div>

<!-- ===================== 대륙 선택 ===================== -->
<div class="screen" id="pick">
  <div class="lobby-inner">
    <div class="bar">
      <div class="bar-l"><button class="ghost" onclick="goLobby()">← 홈</button></div>
      <div class="purse"><div class="n" id="pickGold" style="font-size:20px">0</div><div class="l">골드</div></div>
    </div>
    <div class="pick-head">
      <div class="step" id="pickKind"></div>
      <h2 id="pickTitle"></h2>
      <p id="pickDesc"></p>
    </div>
    <div class="cards" id="pickCont"></div>
  </div>
</div>

<!-- ===================== 학습 목록 ===================== -->
<div class="screen" id="learn">
  <div class="learn-inner">
    <div class="bar">
      <div class="bar-l">
        <button class="ghost" onclick="goLobby()">← 홈</button>
        <div class="steps" id="learnSteps"></div>
        <span class="modetag" id="learnRegion" style="font-size:13px"></span>
      </div>
      <div class="purse"><div class="n" id="learnGold" style="font-size:20px">0</div><div class="l">골드</div></div>
    </div>
    <div id="learnBody"></div>
    <div class="learn-foot" id="learnFoot"></div>
  </div>
</div>

<!-- ===================== 지도 화면 ===================== -->
<div class="screen" id="mapScreen">
  <div class="map-wrap" id="mapWrap">
    <svg id="map"></svg>

    <div class="hud">
      <div class="bar-l" style="display:flex;gap:8px;align-items:center">
        <button class="ghost" onclick="goLobby()">← 홈</button>
        <div class="modetag" id="modeTag"></div>
      </div>
      <div class="stats" id="statsBox">
        <div class="stat"><div class="num" id="scoreNum">0 / 0</div><div class="lbl" id="scoreLbl">맞힌 나라</div></div>
        <div class="stat"><div class="num" id="goldNum">0</div><div class="lbl">골드</div></div>
      </div>
    </div>
    <div class="timer" id="timer">100</div>

    <div class="zoomctl">
      <button id="zIn" title="확대">＋</button>
      <button id="zOut" title="축소">−</button>
      <button id="zReset" title="전체 지도">⟲</button>
    </div>

    <div class="hint-pill" id="hint">지도에서 나라를 눌러 보세요</div>

    <div class="overlay is-hidden" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovBody"></p>
      <div class="ov-btns" id="ovBtns"></div>
      <div class="ov-count" id="ovCount"></div>
    </div>

    <div class="dock" id="dock"><div class="dock-inner" id="dockInner"></div></div>
  </div>

const META = DATA.meta, REGIONS = DATA.regions;
const REGION_ORDER = ['asia-e','asia-w','europe-w','europe-e','africa-n','africa-s','america-n','america-s','oceania'];
function regionIds(r){ return REGIONS[r].codes.concat(Object.keys(REGIONS[r].markers)); }
let curRegion = 'asia-e';
let IDS = regionIds(curRegion);
const featureOf = code => ({type:'Feature', id:code, geometry:GEO[code]});

// ---------- 설정 ----------

const LEARN_STEPS = [
  {id:'map-cap',  label:'STEP 1 · 지도와 수도', title:'지도와 수도', desc:'나라를 누르면 그 자리에 수도가 나타납니다.'},
  {id:'map-flag', label:'STEP 2 · 지도와 국기', title:'지도와 국기', desc:'나라를 누르면 국경 안이 국기로 채워집니다.'},
  {id:'review',   label:'STEP 3 · 한눈에 정리', title:'한눈에 정리', desc:'국기·이름·수도를 한 장에 모아 복습합니다.'},
];
const STAGES = [
  {n:1, tier:'easy', name:'나라 이름', mode:'name',    labels:false, ready:true, desc:'지도에서 나라를 누르고 이름 고르기'},
  {n:2, tier:'easy', name:'수도',      mode:'capital', labels:true,  ready:true, desc:'이름을 보고 수도 고르기'},

  {n:4, tier:'mid',  name:'국기로 찾기', ready:false, desc:'국기를 보고 지도에서 나라 찾기'},
  {n:5, tier:'mid',  name:'수도로 찾기', ready:false, desc:'수도를 보고 지도에서 나라 찾기'},
  {n:6, tier:'hard', name:'이름 없는 지도', ready:false, desc:'힌트 없이 지구본에서 찾기'},
  {n:7, tier:'hard', name:'삼중 관문',   ready:false, desc:'이름·국기·수도를 모두 맞히기'},
];
const TIERS = [
  {id:'easy', label:'쉬운 단계', desc:'보기에서 고르기'},
  {id:'mid',  label:'중간 단계', desc:'거꾸로 지도에서 찾기'},
  {id:'hard', label:'어려운 단계', desc:'힌트 없이 모두 맞히기'},
];
const SEC_PER_COUNTRY = 6, MIN_SECONDS = 100, WRONG_PENALTY = 3;
function stageSeconds(){ return Math.max(MIN_SECONDS, IDS.length * SEC_PER_COUNTRY); }
const GOLD_BASE = 50, GOLD_DECAY = 3, GOLD_MIN = 10, GOLD_FIRST = 20, CLEAR_BONUS = 2;
const LEARN_GOLD = 30;                 // 학습 한 단계를 마치면 주는 골드
const SMALL_AREA = 250;
const ZOOM_STEP = 1.7;                       // ＋ / − 버튼 한 단계
const FOCUS_LEVEL = 2;                       // 나라를 누르면 항상 2단계까지만 확대
const FOCUS_K = Math.pow(ZOOM_STEP, FOCUS_LEVEL);
// 확대는 대한민국(약 10만 km²) 이하 크기의 나라에만 — META의 sm 표시
// 국기는 국토를 딱 덮을 만큼만 크게 얹습니다

const FLAG_ROTATE_AT = 2.0;         // 세로/가로 비가 이보다 큰 나라만 국기를 세웁니다
const FLAG_MIN_W = 16;              // 아주 작은 나라에서도 이 폭(px)은 유지

const HOLD_OK = 420, HOLD_NO = 650;          // 채점 결과를 보여 주는 시간


// ---------- 저장 ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('geo:'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('geo:'+k, JSON.stringify(v)); }catch(e){} }
};
let gold = store.get('gold', 0);
// 진도는 지역별로 기록합니다  { steps:{지역:{STEP:true}}, practice:{지역:{1:true}}, stages:{지역:{1:{pct}}} }
let progress = store.get('progress', null);
if(!progress || !progress.v2) progress = {v2:true, steps:{}, practice:{}, stages:{}};
const PASS_PCT = 0.6;      // STAGE 통과 기준
function bag(kind, r){ if(!progress[kind][r]) progress[kind][r] = {}; return progress[kind][r]; }
function saveProgress(){ store.set('progress', progress); }

function stepDoneIn(r, id){ return !!bag('steps', r)[id]; }
function practiceDoneIn(r, n){ return !!bag('practice', r)[n]; }
function stagePassedIn(r, n){ const x = bag('stages', r)[n]; return !!x && x.pct >= PASS_PCT; }
function stepOpenIn(r, i){ return i===0 ? true : stepDoneIn(r, LEARN_STEPS[i-1].id); }
function practiceOpenIn(r, n){ return stepDoneIn(r, LEARN_STEPS[n-1].id); }
function stageOpenIn(r, n){ return n<=3 ? practiceDoneIn(r, n) : stagePassedIn(r, n-1); }
const anyRegion = fn => REGION_ORDER.some(fn);
const allRegions = fn => REGION_ORDER.every(fn);
function regionCleared(r){
  return LEARN_STEPS.every(st=> stepDoneIn(r, st.id)) &&
         [1,2,3].every(n=> practiceDoneIn(r, n)) && [1,2,3].every(n=> stagePassedIn(r, n));
}
function regionScore(r){          // 지역당 최대 9단계
  let n = 0;
  LEARN_STEPS.forEach(st=>{ if(stepDoneIn(r, st.id)) n++; });
  [1,2,3].forEach(x=>{ if(practiceDoneIn(r, x)) n++; if(stagePassedIn(r, x)) n++; });
  return n;
}
// 홈에서는 '어느 한 지역에서라도 열렸는가'로 표시하고, 지역별 잠금은 지역 선택 화면에서 안내합니다
function stepOpen(i){ return anyRegion(r=> stepOpenIn(r, i)); }
function practiceOpen(n){ return anyRegion(r=> practiceOpenIn(r, n)); }
function stageOpen(n){ return anyRegion(r=> stageOpenIn(r, n)); }
function practiceDone(n){ return anyRegion(r=> practiceDoneIn(r, n)); }
function stepDone(id){ return anyRegion(r=> stepDoneIn(r, id)); }
function stepCond(i){ return `STEP ${i}을 마치면 열립니다`; }
function practiceCond(n){ return `STEP ${n}을 마치면 열립니다`; }

// 대결 종목별 해금 조건
const DUELS = [
  {id:'name',      name:'지도 대결',     desc:'지도에서 나라 찾기로 겨룹니다',
   cond:()=> allRegions(r=> practiceDoneIn(r,1)), text:'모든 대륙의 연습 1을 마치면 열립니다'},
  {id:'capital',   name:'수도 대결',     desc:'수도 맞히기로 겨룹니다',
   cond:()=> allRegions(r=> practiceDoneIn(r,2)), text:'모든 대륙의 연습 2를 마치면 열립니다'},
  {id:'flag',      name:'국기 대결',     desc:'국기 맞히기로 겨룹니다',
   cond:()=> allRegions(r=> practiceDoneIn(r,3)), text:'모든 대륙의 연습 3을 마치면 열립니다'},
  {id:'champions', name:'챔피언스 리그', desc:'전 세계 무작위 출제 · 연속 정답 콤보',
   cond:()=> allRegions(regionCleared), text:'모든 대륙의 배우기 · 연습 · 문제를 마치면 열립니다'},
];

function stageCond(n){ return n<=3 ? `연습 ${n}을 마치면 열립니다` : `STAGE ${n-1}에서 ${Math.round(PASS_PCT*100)}% 이상 맞히면 열립니다`; }
function saveProgress(){ store.set('progress', progress); }

// ---------- 화면 전환 ----------
let screenName = 'lobby';
function showScreen(n){
  screenName = n;
  ['lobby','pick','learn','mapScreen','duelHome','trophyHome'].forEach(s=> document.getElementById(s).classList.toggle('on', s===n));
}
function goHome(){
  stopStage();
  isPractice = false;
  showScreen('lobby');
  renderLobby();
}
const goLobby = goHome;   // 이전 이름도 함께 씁니다

// ---------- 지도 ----------
const svg = d3.select('#map');
const projection = d3.geoMercator();
const pathGen = d3.geoPath(projection);
let VB_W = 1000, VB_H = 700, zoomK = 1, mapBuilt = false;

const gDefs = svg.append('defs');
const gRoot = svg.append('g');
const gGrid = gRoot.append('g'), gOff = gRoot.append('g'), gOn = gRoot.append('g');
const gFlag = gRoot.append('g'), gCap = gRoot.append('g');
const gMini = gRoot.append('g'), gLbl = gRoot.append('g'), gHit = gRoot.append('g');

// 국기를 지도 위에 그리기 위한 이미지 주소
const flagHrefCache = {};
function flagUrl(code){
  const f = META[code].flag;
  if(flagHrefCache[f]) return flagHrefCache[f];
  const raw = FLAGS[f] || '';
  const m = raw.match(/src="([^"]+)"/);
  const url = m ? m[1] : 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(raw);
  flagHrefCache[f] = url;
  return url;
}

const zoom = d3.zoom().scaleExtent([1,14])
  .on('zoom', ev=>{ zoomK = ev.transform.k; gRoot.attr('transform', ev.transform); rescale(); });
svg.call(zoom).on('dblclick.zoom', null);

function rescale(){
  const k = zoomK;
  gHit.selectAll('.hit-dot').attr('r', 15/k);
  gMini.selectAll('.mini').attr('r', 10/k).style('opacity', k > FOCUS_K*1.4 ? 0 : 1);
  gOn.selectAll('.dot-city').attr('r', 5/k);
  gLbl.selectAll('.label').style('font-size', (12/k)+'px').style('stroke-width', (2.5/k)+'px');
  gCap.selectAll('.cap-dot').attr('r', 4.2/k);
}

function buildMap(){
  const wrap = document.getElementById('mapWrap');
  VB_W = wrap.clientWidth || 1000;
  VB_H = wrap.clientHeight || 700;
  svg.attr('viewBox', `0 0 ${VB_W} ${VB_H}`);

  const R = REGIONS[curRegion], v = R.view;
  projection.rotate([R.rot || 0, 0]);   // 태평양을 걸치는 지역은 지도 중심을 옮긴다
  // 네 모서리 점으로 화면 범위를 잡는다 (폴리곤을 쓰면 안팎이 뒤집혀 세계 전체가 잡힌다)
  const box = {type:'MultiPoint', coordinates:[[v[0][0],v[0][1]],[v[1][0],v[0][1]],[v[1][0],v[1][1]],[v[0][0],v[1][1]]]};
  const padX = Math.max(20, VB_W*0.03);
  projection.fitExtent([[padX,62],[VB_W-padX, VB_H-120]], box);
  zoom.translateExtent([[-VB_W*0.6, -VB_H*0.6],[VB_W*1.6, VB_H*1.6]]);
  [gGrid,gOff,gOn,gFlag,gCap,gMini,gLbl,gHit].forEach(g=> g.selectAll('*').remove());
  gDefs.selectAll('*').remove();

  const step = Math.round(Math.min(VB_W,VB_H)/15);
  for(let x=0;x<=VB_W;x+=step) gGrid.append('line').attr('class','grid-line').attr('x1',x).attr('y1',0).attr('x2',x).attr('y2',VB_H);
  for(let y=0;y<=VB_H;y+=step) gGrid.append('line').attr('class','grid-line').attr('x1',0).attr('y1',y).attr('x2',VB_W).attr('y2',y);

  // 문제에 나오지 않는 나라는 배경으로
  const inRegion = new Set(R.codes);
  const ctx = Object.keys(GEO).filter(c=> !inRegion.has(c)).map(featureOf);
  gOff.selectAll('path').data(ctx).join('path').attr('class','land-off').attr('d', pathGen);

  R.codes.forEach(code=>{
    const f = featureOf(code);
    gOn.append('path').attr('class','country').attr('id','c-'+code).attr('d', pathGen(f));
    const c = labelPoint(code, f);
    if(pathGen.area(f) < SMALL_AREA)
      gMini.append('circle').attr('class','mini').attr('id','m-'+code).attr('cx',c[0]).attr('cy',c[1]).attr('r',10);
    addLabelAndHit(code, c[0], c[1], 3);
  });

  // 국토가 아주 작아 지도에 그릴 수 없는 나라는 점으로
  Object.entries(R.markers).forEach(([code, lonlat])=>{
    const p = projection(lonlat);
    gOn.append('circle').attr('class','dot-city').attr('id','c-'+code).attr('cx',p[0]).attr('cy',p[1]).attr('r',5);
    gMini.append('circle').attr('class','mini').attr('id','m-'+code).attr('cx',p[0]).attr('cy',p[1]).attr('r',10);
    addLabelAndHit(code, p[0], p[1], 18);
  });

  svg.call(zoom.transform, d3.zoomIdentity);
  rescale();
  mapBuilt = true;
}

// 이름표·터치점 위치: 지정 좌표가 있으면 그것을, 없으면 무게중심을 쓰고 화면 안으로 당깁니다
function labelPoint(code, f){
  const m = META[code];
  const p = m.anchor ? projection(m.anchor) : pathGen.centroid(f);
  return [ Math.max(26, Math.min(VB_W-26, p[0])), Math.max(74, Math.min(VB_H-106, p[1])) ];
}

function addLabelAndHit(code, x, y, dy){
  gLbl.append('text').attr('class','label').attr('id','l-'+code).attr('x',x).attr('y',y+dy).text(META[code].name);
  if(GEO[code] && REGIONS[curRegion].codes.includes(code)){
    gHit.append('path').attr('class','hit').attr('id','hp-'+code).attr('d', pathGen(featureOf(code)))
      .on('click', ()=> touchCountry(code)).on('mouseenter',()=>hover(code,true)).on('mouseleave',()=>hover(code,false));
  }
  gHit.append('circle').attr('class','hit hit-dot').attr('id','h-'+code).attr('cx',x).attr('cy',y).attr('r',15)
    .on('click', ()=> touchCountry(code)).on('mouseenter',()=>hover(code,true)).on('mouseleave',()=>hover(code,false));
}

function focusCountry(id, instant){
  const R = REGIONS[curRegion];
  let cx, cy;
  if(R.codes.includes(id)){
    const p = labelPoint(id, featureOf(id)); cx = p[0]; cy = p[1];
  } else if(R.markers[id]){
    const p = projection(R.markers[id]); cx = p[0]; cy = p[1];
  } else {
    return;                       // 이 지역에 속하지 않는 나라
  }
  if(!isFinite(cx) || !isFinite(cy)){ return; }
  // 작은 나라만 확대하고, 나머지는 배율 그대로 위치만 가운데로 옮깁니다
  const k = META[id].sm ? FOCUS_K : 1;
  const dockH = document.getElementById('dock').offsetHeight || 0;
  const targetY = (VB_H - dockH) / 2;
  const t = d3.zoomIdentity.translate(VB_W/2, targetY).scale(k).translate(-cx,-cy);
  (instant ? svg : svg.transition().duration(ZOOM_MS)).call(zoom.transform, t);
}
function unfocus(){ svg.transition().duration(BACK_MS).call(zoom.transform, d3.zoomIdentity); }
document.getElementById('zIn').onclick    = ()=> svg.transition().duration(200).call(zoom.scaleBy, ZOOM_STEP);
document.getElementById('zOut').onclick   = ()=> svg.transition().duration(200).call(zoom.scaleBy, 1/ZOOM_STEP);
document.getElementById('zReset').onclick = ()=> unfocus();

function hover(id,on){
  ['c-'+id,'m-'+id].forEach(x=>{ const el=document.getElementById(x); if(el) el.classList.toggle('hover', on && active(id)); });
}

// ---------- 지도 화면 상태 ----------
let mapMode = 'play';               // 'play' | 'learn'
let level = 1;
let seen = new Set();               // 학습 모드에서 눌러본 나라
let done = new Set();               // 이번 판에서 맞힌 나라
let discovered = {};                // 단계별 최초 정답 기록
let solved = 0, timeLeft = MIN_SECONDS, tick = null, stageOn = false;
let currentId = null, pickedId = null, pickedEl = null, graded = false, qStart = 0;
let ovTimer = null;

const dock = document.getElementById('dock'), dockInner = document.getElementById('dockInner');
const hint = document.getElementById('hint'), timerEl = document.getElementById('timer');
const overlay = document.getElementById('overlay');

function active(id){ return stageOn && !(mapMode==='play' ? done.has(id) : false); }

function paintMap(){
  const showLabels = mapMode==='learn' ? true : (STAGES[level-1].labels);
  const doneSet = mapMode==='play' ? done : seen;
  IDS.forEach(id=>{
    ['c-'+id,'m-'+id].forEach(x=>{
      const el = document.getElementById(x); if(!el) return;
      el.classList.remove('hover');
      el.classList.toggle('done', doneSet.has(id));
      el.classList.toggle('active', currentId===id);
    });
    const lb = document.getElementById('l-'+id);
    if(lb) lb.classList.toggle('is-hidden', !showLabels);
    const off = !stageOn || (mapMode==='play' && done.has(id));
    ['h-'+id,'hp-'+id].forEach(hid=>{ const h=document.getElementById(hid); if(h) h.classList.toggle('off', off); });
  });
}

function closeDock(){ dock.classList.remove('open'); document.documentElement.style.setProperty('--dock','0px'); hint.style.opacity = stageOn?'1':'0'; }
function openDock(){ dock.classList.add('open'); document.documentElement.style.setProperty('--dock', dock.offsetHeight+'px'); hint.style.opacity='0'; }

function touchCountry(id){ mapMode==='play' ? askCountry(id) : showLearnCard(id); }

// ---------- 학습(지도) ----------
let learnKind = 'map-cap';
function enterLearnMap(kind){
  learnKind = kind || 'map-cap';
  mapMode = 'learn'; stageOn = true; seen = new Set(); currentId = null; IDS = regionIds(curRegion);
  showScreen('mapScreen');
  buildMap();
  const isCap = learnKind === 'map-cap';
  document.getElementById('modeTag').innerHTML =
    `배우기 <b>STEP ${isCap?1:2} · ${isCap?'지도와 수도':'지도와 국기'}</b> · ${REGIONS[curRegion].name}`;
  document.getElementById('scoreLbl').textContent = '눌러본 나라';
  timerEl.classList.add('is-hidden');
  overlay.classList.add('is-hidden');
  updateStats(); paintMap(); closeDock();
  hint.textContent = isCap ? '나라를 누르면 수도가 지도에 표시됩니다'
                           : '나라를 누르면 국경 안이 국기로 채워집니다';
  hint.style.opacity = '1';
}

// 수도를 지도 위에 찍는다
function showCapitalOnMap(id){
  if(document.getElementById('cap-'+id)) return;
  const ll = META[id].cap; if(!ll) return;
  const p = projection(ll);
  gCap.append('circle').attr('class','cap-dot').attr('id','cap-'+id)
      .attr('cx',p[0]).attr('cy',p[1]).attr('r',4.2/zoomK);
}

// 국경선 모양대로 국기를 채운다
function showFlagOnMap(id){
  if(document.getElementById('fl-'+id)) return;
  const R = REGIONS[curRegion];
  let x, y, w, h, rot = 0, clip = null;

  if(R.codes.includes(id)){
    const f = featureOf(id), b = pathGen.bounds(f);
    const bw = Math.max(3, b[1][0]-b[0][0]), bh = Math.max(3, b[1][1]-b[0][1]);
    const cx = (b[0][0]+b[1][0])/2, cy = (b[0][1]+b[1][1])/2;
    // 세로로 긴 나라는 국기를 세워서 덮습니다
    const tall = bh > bw * FLAG_ROTATE_AT;
    if(tall){
      h = Math.max(bw, bh*3/4, FLAG_MIN_W) * FLAG_OVER; w = h*4/3; rot = 90;
    } else {
      w = Math.max(bw, bh*4/3, FLAG_MIN_W) * FLAG_OVER; h = w*3/4;
    }
    x = cx - w/2; y = cy - h/2;
    gDefs.append('clipPath').attr('id','clip-'+id).append('path').attr('d', pathGen(f));
    clip = 'url(#clip-'+id+')';
  } else {
    const p = projection(R.markers[id]);
    w = 28; h = 21; x = p[0]-w/2; y = p[1]-h/2;
  }

  const holder = gFlag.append('g').attr('id','fl-'+id).attr('class','flag-img');
  if(clip) holder.attr('clip-path', clip);
  const inner = holder.append('g');
  if(rot) inner.attr('transform', `rotate(${rot}, ${x+w/2}, ${y+h/2})`);

  const raw = FLAGS[META[id].flag] || '';
  const src = raw.match(/src="([^"]+)"/);
  if(src){
    inner.append('image').attr('href', src[1]).attr('x',x).attr('y',y)
      .attr('width',w).attr('height',h).attr('preserveAspectRatio','none');
  } else {
    inner.node().insertAdjacentHTML('beforeend', raw);
    const el = inner.node().lastElementChild;
    el.setAttribute('x', x); el.setAttribute('y', y);
    el.setAttribute('width', w); el.setAttribute('height', h);
    el.setAttribute('preserveAspectRatio', 'none');
  }
}

function showLearnCard(id){
  currentId = id; seen.add(id); paintMap(); updateStats();
  const isCap = learnKind === 'map-cap';
  if(isCap) showCapitalOnMap(id); else showFlagOnMap(id);
  const body = isCap
    ? `<div class="txt"><div class="nm one">${META[id].name} <span class="sep">—</span> 수도 <b>${META[id].capital}</b></div></div>`
    : `<div class="fl">${FLAGS[META[id].flag]||''}</div>
       <div class="txt"><div class="nm">${META[id].name}</div>
         <div class="cp">${REGIONS[curRegion].name}</div></div>`;
  dockInner.innerHTML = `
    <div class="q-head"><div><span class="q-ask">배우기 · ${isCap?'지도와 수도':'지도와 국기'}</span></div>
      <button class="close-x" id="closeX">✕</button></div>
    <div class="info">${body}</div>`;
  document.getElementById('closeX').onclick = ()=>{ currentId=null; paintMap(); closeDock(); unfocus(); };
  openDock(); focusCountry(id);
  if(seen.size === IDS.length) setTimeout(finishLearnMap, 900);
}

function finishLearnMap(){
  stageOn = false; closeDock(); unfocus(); paintMap();
  const isCap = learnKind === 'map-cap';
  const first = !stepDoneIn(curRegion, learnKind);
  if(first){ markLearn(learnKind); updateStats(); }
  showOverlay(isCap ? 'STEP 1 완료 · 지도와 수도' : 'STEP 2 완료 · 지도와 국기',
    `${IDS.length}개 나라를 모두 확인했습니다.` + (first ? `<br>학습 보너스 +${LEARN_GOLD}골드` : ''),
    [{t:'확인', gold:true, fn:goHome}, {t:'다시하기', fn:()=> enterLearnMap(learnKind)}], 8);
}

// ---------- 문제 풀이 ----------
let isPractice = false;
function enterPractice(n, cont){ enterStage(n, cont, true); }

function enterStage(n, cont, practice){
  const st = STAGES[n-1];
  if(!st.ready) return;
  isPractice = !!practice;
  if(cont){ curRegion = cont; } IDS = regionIds(curRegion);
  mapMode='play'; level=n;
  showScreen('mapScreen');
  buildMap();
  document.getElementById('modeTag').innerHTML = isPractice
    ? `연습 <b>${n} · ${st.name}</b> · ${REGIONS[curRegion].name}`
    : `${st.tier==='easy'?'쉬운':st.tier==='mid'?'중간':'어려운'} <b>STAGE ${n} · ${st.name}</b> · ${REGIONS[curRegion].name}`;
  document.getElementById('scoreLbl').textContent = '맞힌 나라';
  timerEl.classList.toggle('is-hidden', isPractice);
  hint.textContent = '지도에서 나라를 눌러 보세요';
  startStage();
}

function startStage(){
  done = new Set(); solved = 0; timeLeft = stageSeconds(); currentId = null; stageOn = true;
  if(!discovered[level]) discovered[level] = new Set();
  overlay.classList.add('is-hidden');
  if(ovTimer){ clearInterval(ovTimer); ovTimer=null; }
  timerEl.textContent = timeLeft; timerEl.classList.remove('low');
  updateStats(); paintMap(); closeDock(); unfocus();
  if(tick) clearInterval(tick);
  if(isPractice) return;                 // 연습은 시간 제한이 없습니다
  tick = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){ timeLeft=0; endStage(false); }
    timerEl.textContent = timeLeft;
    timerEl.classList.toggle('low', timeLeft<=10);
  },1000);
}
function stopStage(){
  stageOn=false;
  if(tick){ clearInterval(tick); tick=null; }
  if(ovTimer){ clearInterval(ovTimer); ovTimer=null; }
  currentId=null; closeDock(); overlay.classList.add('is-hidden');
}

function endStage(cleared){
  stageOn=false;
  const cc = counts(); if(isPractice) cc.practice++; else cc.stage++; saveProgress();
  if(tick){ clearInterval(tick); tick=null; }
  currentId=null; paintMap(); closeDock(); unfocus(); hint.style.opacity='0';
  if(isPractice){
    const first = !practiceDoneIn(curRegion, level);
    if(first){ bag('practice', curRegion)[level] = true; saveProgress(); gold += LEARN_GOLD; store.set('gold', gold); updateStats(); }
    showOverlay('연습 완료', `${IDS.length}개 나라를 모두 맞혔습니다.` + (first ? `<br>연습 보너스 +${LEARN_GOLD}골드<br><span style="color:var(--gold-bright)">STAGE ${level}이 열렸습니다</span>` : ''),
      [{t:'확인', gold:true, fn:goHome}, {t:'다시하기', fn:()=> startStage()}], 8);
    return;
  }
  let earned = 0;
  if(cleared){ earned = timeLeft*CLEAR_BONUS; gold += earned; }
  store.set('gold', gold); updateStats();
  const pct = solved / IDS.length;
  const rec = bag('stages', curRegion)[level] || {solved:0, pct:0};
  if(pct > rec.pct){ bag('stages', curRegion)[level] = {solved, pct}; saveProgress(); }
  const nextReady = level<7 && STAGES[level].ready;   // 아직 만들지 않은 STAGE는 안내하지 않음
  const opened = (nextReady && pct>=PASS_PCT && !rec_passed(rec)) ? level+1 : 0;
  const openMsg = opened ? `<br><span style="color:var(--gold-bright)">STAGE ${opened}이 열렸습니다</span>` : '';
  showOverlay(
    cleared ? 'STAGE 클리어' : '시간 종료',
    (cleared
      ? `${timeLeft}초를 남기고 ${IDS.length}개 나라를 모두 맞혔습니다.<br>잔여 시간 보너스 +${earned}골드`
      : `이번 판에서 맞힌 나라 ${solved} / ${IDS.length}개`) + openMsg,
    [{t:'확인', gold:true, fn:goHome}, {t:'다시하기', fn:()=> startStage()}], 8);
}

function rec_passed(rec){ return rec.pct >= PASS_PCT; }

function showOverlay(title, body, btns, autoSec){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovBody').innerHTML = body;
  const box = document.getElementById('ovBtns'); box.innerHTML='';
  btns.forEach(b=>{
    const el = document.createElement('button');
    el.className = b.gold ? 'btn-gold' : 'ghost';
    el.textContent = b.t;
    el.onclick = ()=>{ if(ovTimer){clearInterval(ovTimer); ovTimer=null;} b.fn(); };
    box.appendChild(el);
  });
  overlay.classList.remove('is-hidden');
  const cnt = document.getElementById('ovCount');
  if(ovTimer) clearInterval(ovTimer);
  let left = autoSec;
  cnt.textContent = `${left}초 뒤 홈으로 돌아갑니다`;
  ovTimer = setInterval(()=>{
    left--;
    cnt.textContent = `${left}초 뒤 홈으로 돌아갑니다`;
    if(left<=0){ clearInterval(ovTimer); ovTimer=null; goLobby(); }
  },1000);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickDistractors(id,count,ratio){
  const wantNear = Math.round(count*ratio);
  const near = shuffle((META[id].n||[]).filter(x=> x!==id && META[x]));
  const chosen = near.slice(0,wantNear);
  const rest = shuffle(IDS.filter(x=> x!==id && !chosen.includes(x)));
  while(chosen.length<count && rest.length) chosen.push(rest.pop());
  return chosen.slice(0,count);
}

function askCountry(id){
  if(!stageOn || done.has(id)) return;
  const st = STAGES[level-1];
  currentId=id; pickedId=null; pickedEl=null; graded=false; qStart=performance.now();
  paintMap();
  const options = shuffle([id, ...pickDistractors(id,7,0.6)]);
  const ask = st.mode==='name' ? '이 나라의 이름은?' : st.mode==='flag' ? '이 나라의 국기는?' : '이 나라의 수도는?';
  const sub = st.mode==='capital' ? META[id].name : '';
  dockInner.innerHTML = `
    <div class="q-head"><div><span class="q-ask">${ask}</span> <span class="q-sub">${sub}</span></div>
      <button class="close-x" id="closeX">✕</button></div>
    <div class="opts" id="opts"></div>
    <div class="q-foot"><button class="submit" id="submitBtn" disabled>제출하기</button><span class="msg" id="msg"></span></div>`;
  const optsEl = document.getElementById('opts');
  options.forEach(oid=>{
    const b = document.createElement('button');
    b.className = 'opt' + (st.mode==='flag' ? ' flag' : '');
    b.dataset.id = oid;
    if(st.mode==='flag') b.innerHTML = `<span class="flagbox">${FLAGS[META[oid].flag]||''}</span>`;
    else b.textContent = st.mode==='capital' ? META[oid].capital : META[oid].name;
    b.onclick = ()=> choose(oid,b);
    optsEl.appendChild(b);
  });
  document.getElementById('closeX').onclick = closeQuiz;
  document.getElementById('submitBtn').onclick = grade;
  openDock(); focusCountry(id);
}

function choose(oid, el){
  if(graded) return;
  pickedId=oid; pickedEl=el;
  document.querySelectorAll('#opts .opt').forEach(b=> b.classList.remove('picked'));
  el.classList.add('picked');
  document.getElementById('submitBtn').disabled = false;
}
function closeQuiz(){ currentId=null; paintMap(); closeDock(); unfocus(); }

function grade(){
  if(graded || !pickedId || !stageOn) return;
  graded = true;
  const correct = pickedId === currentId;
  const msg = document.getElementById('msg');
  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('#opts .opt').forEach(b=> b.disabled = true);
  pickedEl.classList.remove('picked');
  pickedEl.classList.add(correct ? 'marked-ok' : 'marked-bad');
  const mark = document.createElement('span');
  mark.className = 'mark ' + (correct?'ok':'bad');
  mark.textContent = correct ? 'O' : 'X';
  pickedEl.appendChild(mark);

  if(correct){
    solved++; done.add(currentId);
    msg.textContent = '정답입니다'; msg.className='msg ok';
    if(!isPractice){
      const sec = (performance.now()-qStart)/1000;
      let g = Math.round(Math.min(GOLD_BASE, Math.max(GOLD_MIN, GOLD_BASE - GOLD_DECAY*sec)));
      if(!discovered[level].has(currentId)){ g += GOLD_FIRST; discovered[level].add(currentId); }
      gold += g; store.set('gold', gold);
      popGold(g);
    }
  } else {
    if(isPractice){
      msg.textContent = '다시 해 볼까요?'; msg.className='msg bad';
    } else {
      timeLeft = Math.max(0, timeLeft-WRONG_PENALTY);
      timerEl.textContent = timeLeft;
      msg.textContent = `아쉬워요. −${WRONG_PENALTY}초`; msg.className='msg bad';
    }
  }
  updateStats(); paintMap();
  setTimeout(()=>{
    if(!stageOn) return;
    if(correct && done.size===IDS.length){ endStage(true); return; }
    closeQuiz();
  }, correct ? HOLD_OK : HOLD_NO);
}

function popGold(g){
  const el = document.createElement('div');
  el.className='gold-pop'; el.textContent='+'+g;
  document.getElementById('mapWrap').appendChild(el);
  setTimeout(()=> el.remove(), 700);
}
function updateStats(){
  const n = mapMode==='play' ? solved : seen.size;
  document.getElementById('scoreNum').textContent = `${n} / ${IDS.length}`;
  document.getElementById('goldNum').textContent = gold;
}

const globeSvg = d3.select('#globe');
const globeProj = d3.geoOrthographic().clipAngle(90).precision(0.6);
const globePath = d3.geoPath(globeProj);
let globeRot = [110, -15], globeTarget = null, globeCtx = null, hiRegion = null;
function initGlobe(){
  const el = document.getElementById('globe');
  const w = el.clientWidth || 300, h = el.clientHeight || 300;
  const R = Math.min(w,h)/2 - 8;
  globeSvg.attr('viewBox', `0 0 ${w} ${h}`);
  globeProj.translate([w/2, h/2]).scale(R);
  globeSvg.selectAll('*').remove();
  globeSvg.append('circle').attr('cx',w/2).attr('cy',h/2).attr('r',R)
    .attr('fill','#12243d').attr('stroke','#2a3f5e');
  globeCtx = globeSvg.append('g');
  drawGlobe();
}
function drawGlobe(){
  if(!globeCtx) return;
  globeProj.rotate(globeRot);
  const feats = Object.keys(GEO).map(featureOf);
  const sel = globeCtx.selectAll('path').data(feats);
  sel.enter().append('path').merge(sel)
    .attr('d', globePath)
    .attr('fill', d=> hiRegion && REGIONS[hiRegion] && REGIONS[hiRegion].codes.includes(d.id) ? '#efe6cf' : '#8a8368')
    .attr('stroke','#6d6752').attr('stroke-width',.4);
}
function spinGlobeTo(rid){
  hiRegion = rid;
  const v = REGIONS[rid].view;
  globeTarget = [ -((v[0][0]+v[1][0])/2), -((v[0][1]+v[1][1])/2) ];
}
let globeLast = 0;
d3.timer((t)=>{
  if(t - globeLast < 55) return;                 // 초당 18프레임 정도로 제한
  const dt = t - globeLast; globeLast = t;
  if(!document.getElementById('lobby').classList.contains('on')) return;
  if(globeTarget){
    globeRot[0] += (globeTarget[0]-globeRot[0])*0.18;
    globeRot[1] += (globeTarget[1]-globeRot[1])*0.18;
    if(Math.abs(globeTarget[0]-globeRot[0]) < 0.5) globeTarget = null;
  } else {
    globeRot[0] += dt * 0.006;                   // 초당 6도쯤 자전
  }
  drawGlobe();
});
